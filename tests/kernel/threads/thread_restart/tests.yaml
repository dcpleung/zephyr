common:
  ignore_faults: true
  tags:
    - kernel
    - threads
tests:
  kernel.threads.restart:
    integration_platforms:
      - native_sim
      - qemu_x86
      - qemu_x86_64
      - qemu_cortex_m3
      - qemu_cortex_a53
      - qemu_xtensa/dc233c
  kernel.threads.restart.smp:
    filter: CONFIG_SMP and CONFIG_MP_MAX_NUM_CPUS > 1
    extra_configs:
      - CONFIG_SCHED_CPU_MASK=y
    integration_platforms:
      - qemu_cortex_a53/qemu_cortex_a53/smp
      - qemu_x86_64
  kernel.threads.restart.userspace:
    filter: CONFIG_ARCH_HAS_USERSPACE
    tags:
      - userspace
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
    integration_platforms:
      - qemu_x86
      - qemu_cortex_a53
  kernel.threads.restart.dynamic:
    extra_configs:
      - CONFIG_THREAD_STACK_INFO=y
      - CONFIG_DYNAMIC_THREAD=y
      - CONFIG_DYNAMIC_THREAD_POOL_SIZE=1
    integration_platforms:
      - native_sim
      - qemu_x86
  kernel.threads.restart.race:
    extra_configs:
      - CONFIG_TRACING=y
      - CONFIG_TRACING_USER=y
    integration_platforms:
      - native_sim
      - qemu_x86_64
      - qemu_cortex_a53/qemu_cortex_a53/smp
